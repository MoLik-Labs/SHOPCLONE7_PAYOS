; PHP-FPM / CGI per-directory settings for this shop.
; .user.ini is read by PHP-FPM and CGI only; under mod_php put the same values in the vhost.
; Every value here is safe to ignore on hosts that do not support the directive.

; --- OPcache: compile each file once, not on every request ------------------
; Without this, every page recompiles ~100 PHP files. This is the single largest
; server-side win available without touching application code.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; The shop is edited by uploading files; two seconds is short enough to deploy safely and long
; enough to stop stat()ing every include on every request.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.save_comments=1

; JIT helps CPU-bound code; it is ignored on builds without JIT (including PHP 7.4).
opcache.jit_buffer_size=64M
opcache.jit=tracing

; --- filesystem -------------------------------------------------------------
realpath_cache_size=4096K
realpath_cache_ttl=600

; --- output / errors --------------------------------------------------------
display_errors=Off
log_errors=On
output_buffering=4096
; Compress dynamic HTML on hosts without mod_deflate (Render's PHP runtime, for example).
; When Apache also deflates, it sees the existing Content-Encoding and does not compress twice.
zlib.output_compression=On
zlib.output_compression_level=6
; Do not advertise the PHP version in the X-Powered-By header.
expose_php=Off

; --- sessions ---------------------------------------------------------------
session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_samesite=Lax
