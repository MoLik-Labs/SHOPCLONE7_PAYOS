name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'documentation/**'
      - '.github/workflows/docs-pages.yml'
  pull_request:
    paths:
      - 'documentation/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix documentation --ignore-scripts
      - name: Check and build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check --prefix documentation
          npm run build --prefix documentation
          npm run lint:content --prefix documentation
          npm run test:links --prefix documentation
          npm run check:links --prefix documentation
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: documentation/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
