name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'documentation/**'
      - '.github/workflows/docs-pages.yml'
  pull_request:
    paths:
      - 'documentation/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix documentation --ignore-scripts
      - name: Check and build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check --prefix documentation
          npm run build --prefix documentation
          npm run lint:content --prefix documentation
          npm run test:links --prefix documentation
          npm run check:links --prefix documentation
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: documentation/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
